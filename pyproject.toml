[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agromatch"
version = "0.2.0"
description = "Muş için talep odaklı ekim planlama motoru: denge, toprak-iklim uygunluğu, hastalık riski ve izlenebilir belirsizlik analizi"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hasan Turgut" }]
keywords = ["tarım", "planlama", "belirsizlik", "monte-carlo", "duyarlılık-analizi"]

# Analiz çekirdeği yalnızca numpy'a bağlıdır. Paneli üretmek için bu yeterlidir.
# Görüntü işleme ve model eğitimi ağır bağımlılıklar getirir; onlar isteğe bağlı
# ek (extra) olarak tanımlandı. Böylece projeyi sadece incelemek isteyen biri
# 2 GB'lık torch indirmek zorunda kalmaz.
dependencies = [
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
# Cercospora görüntü işleme hattı
goruntu = [
    "opencv-python-headless>=4.9,<5",
    "pillow>=10,<13",
]
# Dış veri kaynaklarından çekme araçları
veri = [
    "pandas>=2.0,<4",
    "requests>=2.31,<3",
]
# CNN eğitimi — en ağır küme, yalnızca model eğitilecekse gerekir
egitim = [
    "torch>=2.2",
    "torchvision>=0.17",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<4",
]
# Geliştirme araçları
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5",
    "mypy>=1.9",
    "ruff>=0.4",
]
# Hepsi birden
hepsi = [
    "agromatch[goruntu,veri,egitim,dev]",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "yavas: çalışması uzun süren testler (Monte Carlo, panel üretimi)",
]

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Kural kümesi bilerek dar tutuldu: bugün SIFIR uyarıyla geçiyor.
# İlk günden kırmızı yanan bir denetim, görmezden gelinmeye alışılan bir
# denetimdir. Eski dosyalar temizlendikçe ignore listesi kısaltılacak.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E741",  # tek harfli değişken (matematik formüllerinde okunaklı)
    "E702",  # aynı satırda noktalı virgülle iki ifade — eski dosyalarda var
    "B007",  # kullanılmayan döngü değişkeni (tuple açarken kaçınılmaz)
    "B905",  # zip(strict=) — davranış bilerek varsayılan
    "SIM108",  # üçlü operatör dayatması; uzun koşullarda okunaklılığı bozuyor
]

[tool.ruff.lint.per-file-ignores]
# Belge üreticiler gömülü HTML ve CSS taşır; satır uzunluğu doğaldır.
"src/kutu_foyu.py" = ["E501"]
"src/ozet_uret.py" = ["E501"]
# Veri tabloları hizalı yazıldığında okunaklıdır.
"src/toprak_profil.py" = ["E501"]
"src/hastalik_profil.py" = ["E501"]
"src/bolge_profil.py" = ["E501"]
"src/ekonomi_profil.py" = ["E501"]
"src/kaynak_profil.py" = ["E501"]
"tests/*" = ["E501"]

# ------------------------------------------------------------------ mypy
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# Kademeli tipleme. Çekirdek sekiz modül tam tipli ve mypy'den temiz geçiyor;
# CI yalnızca onları denetler. Eski bölgesel modüller ve görüntü işleme hattı
# henüz tiplenmedi — sırayla eklenecek, her eklemede bu liste büyüyecek.
files = [
    "src/iz.py",
    "src/mus_profil.py",
    "src/mus_iklim.py",
    "src/mus_toprak.py",
    "src/mus_hastalik.py",
    "src/mus_analiz.py",
    "src/mus_iz.py",
    "src/mus_belirsizlik.py",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
