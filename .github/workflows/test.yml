name: Testler

# Her gönderimde ve her birleştirme isteğinde testler çalışır.
# Amaç: "benim makinemde çalışıyordu" cümlesini ortadan kaldırmak.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Veri tutarlılığını denetle
        run: python src/mus_profil.py

      # Testler TEMİZ bir klonda çalışır: outputs/ depoda yoktur.
      # Gerekli çıktıyı tests/conftest.py üretir; önden hazırlık yapılmaz.
      # Amaç, "benim makinemde geçiyordu" durumunu CI'da yakalamak.
      - name: Testler
        run: pytest -q

      - name: Panel üretilebiliyor mu
        run: python src/mus_panel_uret.py --hepsi

      - name: Panel gerçekten yazılmış mı
        run: |
          test -f mus_panel.html
          test "$(stat -c%s mus_panel.html)" -gt 100000

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Biçim ve statik denetim
        run: ruff check src tests
      - name: Tip denetimi
        run: mypy
